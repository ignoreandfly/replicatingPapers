[project]
name = "toy-vlm"
version = "0.0.0"
description = "Toy re-implementations of VLM papers, one rung at a time."
requires-python = "==3.11.*"

# Pins are exact on purpose. This box is 2x RTX 3090 on NVIDIA driver 515.43.04
# (CUDA 11.7-era), so torch MUST be a cu118 build; every cu12x wheel fails to
# initialise here. 2.7.1 is the newest cu118 wheel for cp311.
dependencies = [
    "torch==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
    "numpy==2.1.3",
    "einops==0.8.1",
    "matplotlib==3.10.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[tool.pytest.ini_options]
# Tests import `src.*` directly; no editable install required.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "rung1: tests for CLIP from scratch — expected to FAIL until src/models/clip.py is written by hand",
    "slow: takes more than a few seconds (overfit loops)",
]
